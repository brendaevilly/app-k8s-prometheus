apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-primos
  namespace: primos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-primos
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   # meta: 50% do "requests" de CPU (50m por pod)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # padrão é 300s; reduzido para o vídeo ficar curto