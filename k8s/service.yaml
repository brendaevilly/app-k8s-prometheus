apiVersion: v1
kind: Service
metadata:
  name: api-primos
  namespace: primos
  labels:
    app: api-primos                # o ServiceMonitor encontra o Service por este label
spec:
  type: ClusterIP
  selector:
    app: api-primos                # envia tráfego para os pods com este label
  ports:
    - name: http                   # o ServiceMonitor referencia esta porta pelo nome
      port: 80
      targetPort: http             # porta "http" (8080) do container